name: Weekly BW News Digest

# This gives the bot permission to push the archive.json file back to the repo
permissions:
  contents: write

on:
  schedule:
    # Runs at 8:00 AM UTC every Friday
    - cron: '0 8 * * 5'
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This ensures the bot can use the token to push later
          persist-credentials: true 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Commit archive updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

            - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium
          git add archive.json
          # Only commit if there are actual changes to the archive
          git diff --staged --quiet || git commit -m "Update news archive [skip ci]"
          # Push using the default GitHub token
          git push origin HEAD:main
